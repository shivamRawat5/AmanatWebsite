<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Timeline Banner</title>
    <style>
        /* CSS Styling */
        .banner-section {
            padding: 40px 0;
            background: #f3eae1; /* Adjust background color as needed */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .banner-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .text-content {
            flex: 1;
            max-width: 600px;
        }

        .circle-accent {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
            margin-left: 40px;
        }

        .circle-accent img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Text adjustments */
        .hashtag {
            font-size: 2.5vw; /* Responsive font size */
            letter-spacing: 1.2px; /* Improved spacing */
            margin-bottom: 20px;
            color: #b14c4c;
            font-family: "Work Sans", Arial, sans-serif;
        }

        .date {
            font-size: 2vw; /* Responsive font size */
            margin-bottom: 25px;
            line-height: 1; /* Better line spacing */
            font-family: "Work Sans", Arial, sans-serif;
        }

        .date sup {
            font-size: 0.6em;
            vertical-align: super;
            margin-left: 2px;
            font-family: "Work Sans", Arial, sans-serif;
        }

        .timeline-title {
            font-size: 2vw; /* Responsive font size */
            letter-spacing: 2px; /* Added letter spacing */
            margin-bottom: 35px;
            position: relative;
            padding-bottom: 15px; /* Added for underline effect */
            font-family: "Work Sans", Arial, sans-serif;
        }

        .timeline-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 80px;
            height: 3px;
            background-color: #b14c4c; /* Accent underline */
        }

        /* Optional: Add responsive design */
        @media (max-width: 768px) {
            .banner-content {
                flex-direction: column;
                text-align: center;
            }

            .circle-accent {
                margin: 40px auto 0;
                width: 300px;
                height: 300px;
            }

            .text-content {
                margin-bottom: 30px;
            }

            .hashtag {
                font-size: 5vw; /* Adjusted for mobile */
            }

            .date {
                font-size: 6vw; /* Adjusted for mobile */
            }

            .timeline-title {
                font-size: 7vw; /* Adjusted for mobile */
            }
        }
    </style>
</head>
<body>
    <!-- Modified HTML -->
    <section class="banner-section">
        <div class="banner-content">
            <div class="text-content">
                <div class="hashtag">#KARTI_KEY_AMANAT</div>
                <div class="date">MARCH 4<sup>th</sup> - 6<sup>th</sup>, 2025</div>
                <div class="timeline-title">Timeline of Events</div>
            </div>
            <div class="circle-accent">
                <img src="Gallary/7.2.jpg" alt="Couple Photo">
            </div>
        </div>
    </section>
</body>
</html>
